- defaults:
    link:
      create: true
      relink: true

- clean: ["~"]

- link:
    ~/.gitconfig: .gitconfig
    ~/.gitignore_global: .gitignore_global
    ~/.config/:
      path: config/**
      glob: true
      relink: true
      create: true
      exclude:
        - config/fish/fish_variables*
        - config/workspace-mcp*
        # fisher-managed plugin artifacts; regenerated by `fisher update`,
        # so dotfiles must not own them or linking fights fisher
        - config/fish/functions/_fzf_*
        - config/fish/functions/fzf_configure_bindings.fish
        - config/fish/functions/_nvm_*
        - config/fish/functions/nvm.fish
        - config/fish/functions/bass.fish
        - config/fish/functions/__bass.py
        - config/fish/functions/fisher.fish
        - config/fish/completions/fisher.fish
        - config/fish/completions/fzf_configure_bindings.fish
        - config/fish/completions/nvm.fish
        - config/fish/conf.d/fzf.fish
        - config/fish/conf.d/nvm.fish
    ~/.agents: 
      path: agents
      glob: true
      relink: true
      create: true
    # lazygit reads its config from here on macOS, not from ~/.config
    ~/Library/Application Support/lazygit/config.yml:
      path: config/lazygit/config.yml
      if: '[ "$(uname)" = Darwin ]'
