git:
  overrideGpg: true
  paging:
    colorArg: always
    pager: delta --dark --paging=never
    useConfig: false
gui:
  authorColors:
    "*": "#b4befe"
  showNumstatInFilesView: true
  skipRewordInEditorWarning: true
  tabWidth: 2
  # Catppuccin Mocha (mauve)
  theme:
    activeBorderColor:
      - "#cba6f7"
      - bold
    inactiveBorderColor:
      - "#a6adc8"
    optionsTextColor:
      - "#89b4fa"
    selectedLineBgColor:
      - "#313244"
    cherryPickedCommitBgColor:
      - "#45475a"
    cherryPickedCommitFgColor:
      - "#cba6f7"
    unstagedChangesColor:
      - "#f38ba8"
    defaultFgColor:
      - "#cdd6f4"
    searchingActiveBorderColor:
      - "#f9e2af"
  border: single
  nerdFontsVersion: "3"
  spinner:
    frames:
      - "⠋"
      - "⠙"
      - "⠹"
      - "⠸"
      - "⠼"
      - "⠴"
      - "⠦"
      - "⠧"
      - "⠇"
      - "⠏"
    rate: 80
keybinding:
  files:
    viewResetOptions: <disabled>
