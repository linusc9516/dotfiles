set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"
set -g mouse on
set -g history-limit 10000
set -g focus-events on

unbind C-b
set -g prefix C-a
bind C-a send-prefix
bind v split-window -h -c "#{pane_current_path}"
bind s split-window -v -c "#{pane_current_path}" 

# The pane and window keys below mirror the yabai bindings in skhdrc
# (ctrl + alt + key there, prefix + key here).

# Focus panes
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Swap the pane with its neighbour; focus follows the pane
bind H if -F '#{?pane_at_left,0,1}' "swap-pane -d -t '{left-of}'"
bind J if -F '#{?pane_at_bottom,0,1}' "swap-pane -d -t '{down-of}'"
bind K if -F '#{?pane_at_top,0,1}' "swap-pane -d -t '{up-of}'"
bind L if -F '#{?pane_at_right,0,1}' "swap-pane -d -t '{right-of}'"

# Resize panes
bind -r Left resize-pane -L 5
bind -r Down resize-pane -D 5
bind -r Up resize-pane -U 5
bind -r Right resize-pane -R 5

# Layouts (prefix + z zooms and prefix + space cycles layouts by default)
bind r rotate-window
bind e select-layout -E
bind b select-layout tiled

# Windows are numbered from 1 so that prefix + N lines up with the space keys
set -g base-index 1
set -g renumber-windows on
bind 0 select-window -t :10
bind - previous-window
bind = next-window

# Send the current pane to another window
bind m command-prompt -p "send pane to window:" "join-pane -t ':%%'"

bind c new-window -c "#{pane_current_path}"
bind w choose-window
bind , command-prompt -I "#W" "rename-window '%%'"
bind x kill-pane
bind & kill-window

setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

if-shell 'uname | grep -q Darwin' {
    bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"
    bind p run "pbpaste | tmux load-buffer - && tmux paste-buffer"
    # Mouse drag copies to pbcopy and keeps the highlight until the next click
    bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-no-clear "pbcopy"
}
if-shell 'uname | grep -q Linux' {
    bind -T copy-mode-vi y send -X copy-pipe-and-cancel "clip.exe"
    bind p run "powershell.exe -command Get-Clipboard | tmux load-buffer - && tmux paste-buffer"
    bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-no-clear "clip.exe"
}
# A click exits copy mode and clears the highlight
bind -T copy-mode-vi MouseDown1Pane select-pane \; send -X cancel

bind R source-file ~/.config/tmux/tmux.conf \; display "tmux.conf reloaded"

set -g status-left-length 30
set -g status-right-length 60

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'

set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-processes 'ssh'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'
set -g @yank_action 'copy-pipe'
set -g @yank_with_mouse 'off'
set -g @catppuccin_flavor 'mocha'

run ~/.config/tmux/plugins/catppuccin/tmux/catppuccin.tmux

run '~/.tmux/plugins/tpm/tpm'